# Deploy Profit Hunter using only an iPhone

1. Create a free GitHub account at https://github.com if needed.
2. Create a new repository. Suggested name: profit-hunter.
3. Upload the contents of this project to the repository.
4. In the repository open Settings > Pages.
5. Under Build and deployment, set Source to GitHub Actions.
6. Open the Actions tab. The "Build and deploy Profit Hunter" workflow should run automatically after the files are uploaded.
7. When it finishes, open Settings > Pages to see your HTTPS site address.
8. Open that address in Safari.
9. Tap Share > Add to Home Screen.

Notes:
- The app uses sample marketplace data.
- Avid Hunter billing is only a local prototype unlock.
- Real marketplace integrations and production subscriptions are not connected yet.
